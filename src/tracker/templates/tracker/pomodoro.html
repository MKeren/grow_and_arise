{% extends "base.html" %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Pomodoro Technique</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .pomodoro-container {
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .pomodoro-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .timer {
            font-size: 4rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-start {
            background-color: #28a745;
            color: #fff;
        }

        .btn-pause {
            background-color: #ffc107;
            color: #fff;
        }

        .btn-reset {
            background-color: #dc3545;
            color: #fff;
        }

        .phase {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            margin-top: 10px;
        }

        .task-counter {
            margin-top: 20px;
            font-size: 1rem;
        }

        .task-counter span {
            font-weight: bold;
            color: #3498db;
        }

        .btn-task {
            margin-top: 10px;
            background-color: #3498db;
            color: #fff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="pomodoro-container">
        <h1 class="pomodoro-title">⏱ Enhanced Pomodoro Technique</h1>
        <div class="timer" id="timer">25:00</div>
        <p class="phase" id="phase">Phase: Focus</p>

        <div class="btn-container">
            <button class="btn btn-start" id="start">Start</button>
            <button class="btn btn-pause" id="pause">Pause</button>
            <button class="btn btn-reset" id="reset">Reset</button>
        </div>

        <div class="task-counter">
            Completed Tasks: <span id="task-count">0</span>
        </div>
        <button class="btn btn-task" id="add-task">Add Completed Task</button>
    </div>

    <audio id="alert-sound" src="https://www.soundjay.com/button/beep-07.mp3"></audio>

    <script>
        // DOM elements
        const timerDisplay = document.getElementById("timer");
        const phaseDisplay = document.getElementById("phase");
        const startButton = document.getElementById("start");
        const pauseButton = document.getElementById("pause");
        const resetButton = document.getElementById("reset");
        const taskCountDisplay = document.getElementById("task-count");
        const addTaskButton = document.getElementById("add-task");
        const alertSound = document.getElementById("alert-sound");

        // Initial values
        const focusTime = 25 * 60; // 25 minutes
        const shortBreakTime = 5 * 60; // 5 minutes
        const longBreakTime = 15 * 60; // 15 minutes
        let currentTime = focusTime;
        let isPaused = true;
        let phase = "Focus";
        let cycles = 0;
        let timerInterval;
        let taskCount = localStorage.getItem("taskCount") || 0;

        // Update task count display
        taskCountDisplay.textContent = taskCount;

        // Function to update the timer display
        function updateTimerDisplay() {
            const minutes = Math.floor(currentTime / 60);
            const seconds = currentTime % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        }

       

        // Play alert sound with user interaction authorization
        function playAlertSound() {
            alertSound.currentTime = 0; // Reset the sound to the beginning
            alertSound.play().catch((error) => {
                console.warn("Sound alert blocked by browser until user interacts with the page.");
            });
        }

// Start the timer
function startTimer() {
    // Allow sound playback after user interaction
    alertSound.play().catch(() => {}); // This ensures the sound can play later without restrictions

    if (isPaused) {
        isPaused = false;
        timerInterval = setInterval(() => {
            if (currentTime > 0) {
                currentTime--;
                updateTimerDisplay();
            } else {
                switchPhase();
            }
        }, 1000);
    }
}


        // Function to switch phases
        function switchPhase() {
            if (phase === "Focus") {
                cycles++;
                if (cycles % 4 === 0) {
                    phase = "Long Break";
                    currentTime = longBreakTime;
                } else {
                    phase = "Short Break";
                    currentTime = shortBreakTime;
                }
            } else {
                phase = "Focus";
                currentTime = focusTime;
            }
            phaseDisplay.textContent = `Phase: ${phase}`;
            updateTimerDisplay();
            playAlertSound();
        }

        // Start the timer
        function startTimer() {
            if (isPaused) {
                isPaused = false;
                timerInterval = setInterval(() => {
                    if (currentTime > 0) {
                        currentTime--;
                        updateTimerDisplay();
                    } else {
                        switchPhase();
                    }
                }, 1000);
            }
        }

        // Pause the timer
        function pauseTimer() {
            isPaused = true;
            clearInterval(timerInterval);
        }

        // Reset the timer
        function resetTimer() {
            isPaused = true;
            clearInterval(timerInterval);
            phase = "Focus";
            currentTime = focusTime;
            cycles = 0;
            phaseDisplay.textContent = `Phase: ${phase}`;
            updateTimerDisplay();
        }

        // Add completed task
        function addTask() {
            taskCount++;
            localStorage.setItem("taskCount", taskCount);
            taskCountDisplay.textContent = taskCount;
        }

        // Event listeners
        startButton.addEventListener("click", startTimer);
        pauseButton.addEventListener("click", pauseTimer);
        resetButton.addEventListener("click", resetTimer);
        addTaskButton.addEventListener("click", addTask);

        // Initial display
        updateTimerDisplay();
    </script>
</body>
</html>
{% endblock %}
