{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Modifier l'habitude</h2>
    <form method="post" action="{% url 'tracker:update_habit' habit.id %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success mt-3">
            <i class="fas fa-save me-2"></i>Enregistrer
        </button>
        <a href="{% url 'tracker:habit_report' habit.id %}" class="btn btn-secondary mt-3">Annuler</a>
    </form>
</div>
{% endblock %}
