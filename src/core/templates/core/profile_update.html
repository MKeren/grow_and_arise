<!-- profile_update.html -->

{% extends 'base.html' %}

{% block content %}
  <h2>Update Your Profile</h2>

  {% if messages %}
    <div class="alert alert-success">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
{% endblock %}
