<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #ece9e6, #ffffff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            background: #fff;
        }

        .auth-container h1 {
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .auth-container .btn-social {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .auth-container .btn-social i {
            font-size: 1.2rem;
        }

        .auth-container .btn-link {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .auth-container .btn-link:hover {
            color: #0056b3;
        }

        .lottie-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: #ddd;
        }
    </style>
</head>

<body>
    <!-- Background Animation -->
    <div class="lottie-container">
        <lottie-player src="https://assets4.lottiefiles.com/packages/lf20_u4yrau.json" background="transparent"
            speed="1" style="width: 500px; height: 500px;" loop autoplay></lottie-player>
    </div>

    <!-- Login/Register Form -->
    <div class="auth-container">
        <!-- Login Page -->
        <h1 id="form-title">Login</h1>
        <form id="authForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
            <div class="divider">OR</div>
            <div class="btn-social">
                <button type="button" class="btn btn-outline-danger">
                    <i class="bi bi-google"></i> Login with Google
                </button>
                <button type="button" class="btn btn-outline-primary">
                    <i class="bi bi-facebook"></i> Login with Facebook
                </button>
            </div>
            <p class="text-center mt-3">
                Don't have an account? <a href="#" class="btn-link" id="switch-to-register">Register</a>
            </p>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@lottiefiles/lottie-player@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Switch between login and register
        const formTitle = document.getElementById('form-title');
        const authForm = document.getElementById('authForm');
        const switchLink = document.getElementById('switch-to-register');

        let isLogin = true;

        switchLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;

            if (isLogin) {
                formTitle.textContent = 'Login';
                authForm.innerHTML = `
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                    <div class="divider">OR</div>
                    <div class="btn-social">
                        <button type="button" class="btn btn-outline-danger">
                            <i class="bi bi-google"></i> Login with Google
                        </button>
                        <button type="button" class="btn btn-outline-primary">
                            <i class="bi bi-facebook"></i> Login with Facebook
                        </button>
                    </div>
                    <p class="text-center mt-3">
                        Don't have an account? <a href="#" class="btn-link" id="switch-to-register">Register</a>
                    </p>
                `;
            } else {
                formTitle.textContent = 'Register';
                authForm.innerHTML = `
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                    <div class="divider">OR</div>
                    <div class="btn-social">
                        <button type="button" class="btn btn-outline-danger">
                            <i class="bi bi-google"></i> Register with Google
                        </button>
                        <button type="button" class="btn btn-outline-primary">
                            <i class="bi bi-facebook"></i> Register with Facebook
                        </button>
                    </div>
                    <p class="text-center mt-3">
                        Already have an account? <a href="#" class="btn-link" id="switch-to-register">Login</a>
                    </p>
                `;
            }
        });
    </script>
</body>

</html>
