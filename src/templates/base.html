{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow and Arise</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
     

    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <!-- Sidebar Toggle (Moved to the left side, before the logo) -->
            <button class="btn btn-outline-secondary" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="{% url 'core:home' %}">
                <img src="{% static 'images/logo.png' %}" height="40">
                <span class="ms-2 fw-bold text-secondary">Grow and Arise</span> <!-- Texte neutre -->
            </a>
            <!-- Right-side Controls -->
            <div class="d-flex align-items-center">
                <!-- Language Switch -->
                <form method="get" action="{% url 'core:change_language' %}">
                    <select name="lang" onchange="this.form.submit()">
                        <option value="en" {% if LANGUAGE_CODE == 'en' %}selected{% endif %}>English</option>
                        <option value="fr" {% if LANGUAGE_CODE == 'fr' %}selected{% endif %}>Français</option>
                    </select>
                </form>
                
                <!-- Color Picker for Page Background -->
                <input type="color" id="colorPickerPage" title="Choisir la couleur de la page" class="btn btn-outline-secondary" />
                <!-- Color Picker for Sidebar -->
                <input type="color" id="colorPickerSidebar" title="Choisir la couleur de la sidebar" class="btn btn-outline-secondary ms-2" />
                <!-- Color Picker for Footer -->
                <input type="color" id="colorPickerFooter" title="Choisir la couleur du footer" class="btn btn-outline-secondary ms-2" />
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div>
        <!-- Sidebar -->
       
<nav id="sidebar" class="sidebar bg-gradient shadow">
    <ul class="nav flex-column py-4">
        <li class="nav-item">
            <a href="{% url 'core:home' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-home me-3"></i> Accueil
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'plans:plan_list' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-tasks me-3"></i> Plans
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'tracker:task_list' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-check-circle me-3"></i> Tâches
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'tracker:habit_list' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-heartbeat me-3"></i> Habitudes
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'core:logout' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-user-plus me-3"></i> Logout
            </a>
        </li>

        <li class="nav-item">
            <a href="{% url 'core:home' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-home me-3"></i> Accueil
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'plans:plan_list' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-tasks me-3"></i> Plans
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'tracker:task_list' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-check-circle me-3"></i> Tâches
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'tracker:habit_list' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-heartbeat me-3"></i> Habitudes
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'core:register' %}" class="nav-link d-flex align-items-center">
                <i class="fas fa-user-plus me-3"></i> Inscription
            </a>
        </li>
    </ul>
    <!-- Footer positioned at the bottom -->
    <footer id="footer">
        &copy; 2024 Grow and Arise
    </footer>
</nav>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

     <!-- Footer -->
     <footer class="footer bg-white shadow-sm fixed-bottom w-100">
        <div class="text-center py-2">
            &copy; 2024 Grow and Arise | All Rights Reserved
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar Toggle Logic
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('show');
        });

        // Language Switch Placeholder
        

        // Color Change Logic for Page Background, Sidebar, and Footer
        const colorPickerPage = document.getElementById('colorPickerPage');
        const colorPickerSidebar = document.getElementById('colorPickerSidebar');
        const colorPickerFooter = document.getElementById('colorPickerFooter');
        const footer = document.getElementById('footer');

        // Check if the user has saved color preferences
        const savedPageColor = localStorage.getItem('backgroundColor');
        const savedSidebarColor = localStorage.getItem('sidebarColor');
        const savedFooterColor = localStorage.getItem('footerColor');
        
        if (savedPageColor) {
            document.body.style.backgroundColor = savedPageColor;
        }

        if (savedSidebarColor) {
            sidebar.style.backgroundColor = savedSidebarColor;
        }

        if (savedFooterColor) {
            footer.style.backgroundColor = savedFooterColor;
        }

        // Change background color for page, sidebar, and footer when the user selects a color
        colorPickerPage.addEventListener('input', (event) => {
            const selectedPageColor = event.target.value;
            document.body.style.backgroundColor = selectedPageColor;
            localStorage.setItem('backgroundColor', selectedPageColor);
        });

        colorPickerSidebar.addEventListener('input', (event) => {
            const selectedSidebarColor = event.target.value;
            sidebar.style.backgroundColor = selectedSidebarColor;
            localStorage.setItem('sidebarColor', selectedSidebarColor);
        });

        colorPickerFooter.addEventListener('input', (event) => {
            const selectedFooterColor = event.target.value;
            footer.style.backgroundColor = selectedFooterColor;
            localStorage.setItem('footerColor', selectedFooterColor);
        });
    </script>
</body>
</html>
